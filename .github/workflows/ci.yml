name: Quality and security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: community
          MYSQL_USER: community
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://community:ci-only@127.0.0.1:3306/community
      SESSION_SECRET: ci-test-only-secret-at-least-32-characters
      TEST_MYSQL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: |
            dist/
            apps/public/
            apps/admin/
            packages/database/migrations/
            package.json
            package-lock.json
            docs/
          retention-days: 14
