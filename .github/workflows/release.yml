name: Approved release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: community
          MYSQL_USER: community
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://community:ci-only@127.0.0.1:3306/community
      SESSION_SECRET: ci-test-only-secret-at-least-32-characters
      TEST_MYSQL: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require approved main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Package reproducible candidate
        run: |
          tar -czf community-platform.tar.gz dist apps/public apps/admin packages/database/migrations package.json package-lock.json docs
          sha256sum community-platform.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            community-platform.tar.gz
            SHA256SUMS
  draft:
    needs: verify
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" community-platform.tar.gz SHA256SUMS --verify-tag --draft --generate-notes
