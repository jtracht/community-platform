name: Approved release candidate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: community_test
          MYSQL_USER: community
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://community:ci-only@127.0.0.1:3306/community_test
      SESSION_SECRET: ci-test-only-secret-at-least-32-characters
      TEST_MYSQL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Package reproducible candidate
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - dist apps/public apps/admin packages/database/migrations package.json package-lock.json scripts/build-assets.mjs .env.example docs LICENSE README.md CONTRIBUTING.md SECURITY.md | gzip -n > community-platform.tar.gz
          sha256sum community-platform.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            community-platform.tar.gz
            SHA256SUMS
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
      - name: Verify candidate checksum
        run: sha256sum --check SHA256SUMS
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" community-platform.tar.gz SHA256SUMS --verify-tag --draft --generate-notes
