services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: development-only-root
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: development-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - community-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  community-mysql:
